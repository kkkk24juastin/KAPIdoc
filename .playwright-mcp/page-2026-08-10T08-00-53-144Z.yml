          - heading [level=2] [ref=f87e330]:
            - text: 第一步：注册账号
            - link "Permalink to \"第一步：注册账号\"" [ref=f87e331] [cursor=pointer]:
              - /url: "#第一步-注册账号"
              - text: "#"
          - list [ref=f87e332]:
            - listitem [ref=f87e333]:
              - text: 注册入口：
              - link "https://api.kkkk24juastin.asia/register" [ref=f87e334] [cursor=pointer]:
                - /url: https://api.kkkk24juastin.asia/register
          - paragraph [ref=f87e335]
          - list [ref=f87e336]:
            - listitem [ref=f87e337]: 打开注册入口后，点击页面右上角的“注册”。
            - listitem [ref=f87e338]: 如果你在登录页，也可以点击底部“没有账户？注册”进入注册流程。
          - paragraph [ref=f87e339]:
            - strong [ref=f87e340]: 使用邮箱注册
          - list [ref=f87e341]:
            - listitem [ref=f87e342]: 点击“使用用户名注册”。
            - listitem [ref=f87e343]: 填写邮箱、用户名和密码。
            - listitem [ref=f87e344]: 按页面提示提交，完成注册。
          - blockquote [ref=f87e345]:
            - paragraph [ref=f87e346]:
              - strong [ref=f87e347]: 注意
            - paragraph [ref=f87e348]: 邮箱会用于接收验证与通知；密码建议使用字母、数字和特殊字符组合。请妥善保管登录凭证，避免账号被盗用。
          - heading [level=2] [ref=f87e349]:
            - text: 第二步：登录账号
            - link "Permalink to \"第二步：登录账号\"" [ref=f87e350] [cursor=pointer]:
              - /url: "#第二步-登录账号"
              - text: "#"
          - list [ref=f87e351]:
            - listitem [ref=f87e352]:
              - text: 登录入口：
              - link "https://api.kkkk24juastin.asia/login" [ref=f87e353] [cursor=pointer]:
                - /url: https://api.kkkk24juastin.asia/login
          - paragraph [ref=f87e354]
          - paragraph [ref=f87e355]:
            - strong [ref=f87e356]: 使用邮箱/用户名登录
          - list [ref=f87e357]:
            - listitem [ref=f87e358]: 输入邮箱地址或用户名。
            - listitem [ref=f87e359]: 输入账号密码。
            - listitem [ref=f87e360]: 点击“继续”完成登录。
          - blockquote [ref=f87e361]:
            - paragraph [ref=f87e362]:
              - strong [ref=f87e363]: 设备登录说明
            - paragraph [ref=f87e364]: 浏览器会保持登录状态；在新设备需重复登录流程。
          - heading [level=2] [ref=f87e365]:
            - text: 第三步：购买额度
            - link "Permalink to \"第三步：购买额度\"" [ref=f87e366] [cursor=pointer]:
              - /url: "#第三步-购买额度"
              - text: "#"
          - paragraph [ref=f87e367]: 登录控制台后，进入左侧“钱包管理”页面购买额度。
          - list [ref=f87e368]:
            - listitem [ref=f87e369]: 在“选择充值额度”中选择固定额度，或在“自定义额度”中输入要充值的金额。
            - listitem [ref=f87e370]: 确认页面下方的“实付金额”后，点击“立即支付”。
          - blockquote [ref=f87e371]:
            - paragraph [ref=f87e372]:
              - strong [ref=f87e373]: 支付说明
            - paragraph [ref=f87e374]:
              - text: 目前充值比例为
              - code [ref=f87e375]: 1:1
              - text: ，即
              - strong [ref=f87e376]: 1 元人民币等同于 1 美元额度
              - text: 。如果使用支付宝或微信支付时没有弹出支付页面，请先关闭代理后重试。
          - heading [level=2] [ref=f87e377]:
            - text: 第四步：创建 API 令牌
            - link "Permalink to \"第四步：创建 API 令牌\"" [ref=f87e378] [cursor=pointer]:
              - /url: "#第四步-创建-api-令牌"
              - text: "#"
          - paragraph [ref=f87e379]: 登录后进入控制台面板，左侧选择“令牌管理”。
          - heading [level=3] [ref=f87e380]:
            - text: 进入令牌管理
            - link "Permalink to \"进入令牌管理\"" [ref=f87e381] [cursor=pointer]:
              - /url: "#进入令牌管理"
              - text: "#"
          - list [ref=f87e382]:
            - listitem [ref=f87e383]: 在左侧菜单点击“令牌管理”。
            - listitem [ref=f87e384]: 点击页面上方的“添加令牌”。
          - heading [level=3] [ref=f87e385]:
            - text: 创建新令牌
            - link "Permalink to \"创建新令牌\"" [ref=f87e386] [cursor=pointer]:
              - /url: "#创建新令牌"
              - text: "#"
          - paragraph [ref=f87e387]: 在弹窗中填写令牌信息：
          - list [ref=f87e388]:
            - listitem [ref=f87e389]:
              - text: 令牌名称：用于区分不同用途，例如
              - code [ref=f87e390]: Claude Code
              - text: 、
              - code [ref=f87e391]: Codex
              - text: 、
              - code [ref=f87e392]: Gemini
              - text: 。
            - listitem [ref=f87e393]: 令牌分组：必须选择，分组决定这个令牌可以使用哪些模型。
            - listitem [ref=f87e394]: 过期时间：默认“永不过期”，也可以按需要设置有效期。
            - listitem [ref=f87e395]:
              - text: 新建数量：一般保持
              - code [ref=f87e396]: "1"
              - text: 即可。
            - listitem [ref=f87e397]: 额度设置：开启“无限额度”时，令牌实际可用额度仍受账户余额限制。
            - listitem [ref=f87e398]: 访问限制：不熟悉时建议先保持默认，不要开启模型限制或 IP 白名单。
          - blockquote [ref=f87e399]:
            - paragraph [ref=f87e400]:
              - strong [ref=f87e401]: 令牌分组一定要选对
            - paragraph [ref=f87e402]:
              - text: 令牌分组会直接影响可用模型。比如 Claude Code 选
              - strong [ref=f87e403]: claude code
              - text: 分组、Codex 选
              - strong [ref=f87e404]: Codex
              - text: 分组；使用 Gemini 模型（Cline / Roo Code 等）时选
              - strong [ref=f87e405]: Gemini
              - text: 或
              - strong [ref=f87e406]: gemini
              - text: 分组。如果分组选错，很容易出现“模型不存在”或无法调用的问题。
            - paragraph [ref=f87e407]:
              - text: 如果你不确定每个分组适合什么场景，请先阅读
              - link "小K的AI站点 各分组介绍" [ref=f87e408] [cursor=pointer]:
                - /url: ./../token/
              - text: 。
          - paragraph [ref=f87e409]: 填写完成后，点击右下角“提交”完成创建。
          - heading [level=3] [ref=f87e410]:
            - text: 查看分组可用模型
            - link "Permalink to \"查看分组可用模型\"" [ref=f87e411] [cursor=pointer]:
              - /url: "#查看分组可用模型"
              - text: "#"
          - paragraph [ref=f87e412]: 你可以在“模型广场”查看每个令牌分组下支持哪些模型。
          - list [ref=f87e413]:
            - listitem [ref=f87e414]: 点击页面右上角“模型广场”。
            - listitem [ref=f87e415]: 在左侧“可用令牌分组”中选择分组。
            - listitem [ref=f87e416]: 右侧模型卡片会显示该分组可用的模型、价格和折扣倍率。
          - paragraph [ref=f87e417]: 如果你想了解折扣含义，可以点击模型广场右上方的“折扣说明”。
          - heading [level=2] [ref=f87e418]:
            - text: 第五步：环境检查
            - link "Permalink to \"第五步：环境检查\"" [ref=f87e419] [cursor=pointer]:
              - /url: "#第五步-环境检查"
              - text: "#"
          - paragraph [ref=f87e420]: 在配置 Claude Code、Codex 或 Grok Build 之前，请先确认本机已经正确安装 Node.js。
          - paragraph [ref=f87e421]: 在 Windows、macOS 或 Linux 终端中执行：
          - generic [ref=f87e422]:
            - button "Copy Code" [ref=f87e423] [cursor=pointer]
            - generic [ref=f87e424]: bash
            - code [ref=f87e426]:
              - generic [ref=f87e427]: npm list -g --depth-0
          - paragraph [ref=f87e428]: 如果命令可以正常执行，说明 Node.js 与 npm 已经可用。即使输出中没有安装任何全局包，也不影响后续配置。
          - paragraph [ref=f87e429]: 如果提示“命令未找到”或类似错误，说明当前环境还没有安装 Node.js，或安装后没有正确加入系统环境变量。请先完成 Node.js 安装，再重新执行上面的命令确认。
          - blockquote [ref=f87e430]:
            - paragraph [ref=f87e431]:
              - strong [ref=f87e432]: 必须先完成环境检查
            - paragraph [ref=f87e433]: CLI 工具依赖 Node.js 和 npm。环境没有准备好时，后续安装 Claude Code、Codex 等都可能失败。
          - heading [level=2] [ref=f87e434]:
            - text: 第六步：配置 CLI 工具
            - link "Permalink to \"第六步：配置 CLI 工具\"" [ref=f87e435] [cursor=pointer]:
              - /url: "#第六步-配置-cli-工具"
              - text: "#"
